<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline - Erwin Property Mgmt</title>
<style>
body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
.box { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); max-width: 420px; text-align: center; }
h1 { font-size: 1.2rem; color: #145394; margin-top: 0; }
</style>
</head>
<body>
<div class="box">
<h1>Sie sind offline</h1>
<p>Die Verbindung zum Server ist unterbrochen. Bitte prüfen Sie Ihre Internetverbindung und laden Sie die Seite erneut.</p>
<button onclick="location.reload()" style="padding:.55rem 1.4rem;background:#145394;color:#fff;border:0;border-radius:4px;cursor:pointer">Erneut versuchen</button>
</div>
</body>
</html>
